<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Découvrez les réalisations de Paul Esthor en science des données, développement web, reporting et bases de données.">
    <meta property="og:title" content="Projets | Paul Esthor">
    <meta property="og:description" content="Découvrez les réalisations de Paul Esthor en science des données, développement web, reporting et bases de données.">
    <meta property="og:type" content="website">
    <title>Projets | Paul Esthor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Section Projets */
        .projects-hero {
            padding: 150px 0 50px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .projects-hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--secondary);
        }

        .projects-hero p {
            max-width: 800px;
            margin: 0 auto 40px;
            font-size: 1.1rem;
        }

        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: rgba(26, 39, 68, 0.01);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.3s ease;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2),
                inset 0 0 10px rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover {
            background-color: rgba(76, 201, 240, 0.1);
            border-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 201, 240, 0.3),
                inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .filter-btn.active {
            background-color: var(--secondary);
            color: var(--dark);
            border-color: var(--secondary);
            box-shadow: 0 6px 20px rgba(76, 201, 240, 0.4);
        }

        .filter-btn i {
            font-size: 1rem;
        }

        /* Grille de projets */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px 0;
            position: relative;
            z-index: 1;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .project-card {
            background-color: rgba(26, 39, 68, 0.01);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-decoration: none;
            color: var(--text);
            display: block;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.1),
                0 0 20px rgba(76, 201, 240, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
            background-color: rgba(26, 39, 68, 0.05);
        }

        .project-image {
            display: none;
        }

        .project-info {
            padding: 20px;
        }

        .project-info h3 {
            margin-top: 0;
            color: var(--secondary);
            font-size: 1.3rem;
        }

        .project-info p {
            margin-bottom: 0;
            opacity: 0.9;
        }

        /* Project Badges */
        .project-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .project-badge.scolaire {
            background-color: rgba(76, 201, 240, 0.2);
            color: var(--secondary);
            border: 1px solid rgba(76, 201, 240, 0.3);
        }

        .project-badge.perso {
            background-color: rgba(247, 37, 133, 0.2);
            color: var(--accent);
            border: 1px solid rgba(247, 37, 133, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .projects-hero {
                padding: 150px 0 50px;
            }

            .projects-hero h1 {
                font-size: 2.2rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .filter-btn {
                padding: 10px 18px;
                font-size: 0.85rem;
            }
            .filter-buttons {
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <!-- Header -->
    <header id="header">
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Paul Esthor</a>
                <div class="nav-links">
                    <a href="index.html">Accueil</a>
                    <a href="index.html#qui-suis-je">À propos</a>
                    <a href="parcours.html">Mon Parcours</a>
                    <a href="Projet.html" class="active">Projets</a>
                    <a href="Competences.html">Compétences</a>
                    <a href="bilan.html">Bilan</a>
                    <a href="Contact.html">Contact</a>
                </div>
                <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <!-- Section Hero Projets -->
        <section class="projects-hero">
            <div class="container">
                <h1>Mes Projets</h1>
                <p>Découvrez mes réalisations en science des données et développement</p>

                <!-- Filter Buttons -->
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="scolaire">
                        <i class="fas fa-graduation-cap"></i> Projets Scolaires / Professionnels
                    </button>
                    <button class="filter-btn" data-filter="perso">
                        <i class="fas fa-user"></i> Projets Personnels
                    </button>
                </div>
            </div>
        </section>

        <!-- Grille de projets -->
        <div class="container">
            <div class="projects-grid" id="projectsGrid">
                <!-- Les projets seront injectés ici par JavaScript -->
            </div>
        </div>
    </main>

    <script src="js/animation.js"></script>
    <script>
        // Base de données des projets
        const projects = {
            scolaire: [
                {
                    title: "Création d'un reporting sur Excel et VBA",
                    description: "Visualisation et modification de note afin d'avoir un résumé final sur l'année.",
                    link: "projet1.html",
                    image: "Photo Projet/reporting.jpg"
                },
                {
                    title: "Création d'une base de données en Python et EasyPhp",
                    description: "Conception d'une base de données sur mesure pour une entreprise fictive, de la modélisation à la création.",
                    link: "projet2.html",
                    image: "Photo Projet/BaseDonnée.jpg"
                },
                {
                    title: "IA Classification Douanes (Legrand)",
                    description: "Modèle XGBoost et application web ONNX pour prédire automatiquement la classification douanière de produits industriels.",
                    link: "projet3.html",
                    image: "Photo Projet/reporting.jpg"
                },
                {
                    title: "Analyse statistique sur la démographie française",
                    description: "Réalisation d'un rapport statistique portant sur le chômage et la CSP des français dans un département précis.",
                    link: "projet4.html",
                    image: "Photo Projet/Stat.jpg"
                },
                {
                    title: "Création d'un site en HTML et CSS",
                    description: "Développement d'un site web portfolio avec HTML, CSS et JavaScript.",
                    link: "projet5.html",
                    image: "Photo Projet/Portfolio.jpg"
                },
                {
                    title: "Modèle de régression linéaire",
                    description: "Modèle R pour prédire les prix immobiliers en Deux-Sèvres à partir de données historiques.",
                    link: "projet6.html",
                    image: "Photo Projet/RegLine.jpg"
                },
                {
                    title: "Analyse de données avec Python",
                    description: "Projet d'analyse de données utilisant Pandas, NumPy et Matplotlib pour visualiser des tendances.",
                    link: "projet7.html",
                    image: "Photo Projet/Wait.jpg"
                },
                {
                    title: "Dashboard Power BI",
                    description: "Création d'un tableau de bord interactif pour visualiser des KPIs d'entreprise.",
                    link: "projet8.html",
                    image: "Photo Projet/Wait.jpg"
                }
            ],
            perso: [
                {
                    title: "Emylas Animation",
                    description: "Portfolio pour un Speaker et Animateur Sportif. Site vitrine immersif One-Page.",
                    link: "projet9.html",
                    image: "Photo Projet/Oui2.jpg"
                },
                {
                    title: "Jeu de la Pyramide",
                    description: "Jeu de cartes multijoueur inspiré du célèbre jeu de soirée, développé avec Node.js.",
                    link: "projet10.html",
                    image: "Photo Projet/pyramide.png"
                },
                {
                    title: "Skiny 8000",
                    description: "Application PWA complète de suivi de musculation : programmes, historique, et statistiques.",
                    link: "projet11.html",
                    image: "Photo Projet/skiny-8000.png"
                },
                {
                    title: "Spoti-Lolo",
                    description: "Bibliothèque musicale personnelle pour gérer et trier ses partitions et playlists.",
                    link: "projet12.html",
                    image: "Photo Projet/spoti-lolo.png"
                },
                {
                    title: "Mon Portfolio",
                    description: "Le site sur lequel vous naviguez actuellement, conçu de A à Z en HTML/CSS/JS.",
                    link: "projet13.html",
                    image: "Photo Projet/Portfolio.jpg"
                },
                {
                    title: "Mathilde Gest - Tapissier Décorateur",
                    description: "Site vitrine haut de gamme avec CMS d'édition en ligne en cours de développement pour une tapissière décoratrice. Intégration Supabase.",
                    link: "projet17.html",
                    image: "Photo Projet/mathilde_gest_mockup.png"
                },
                {
                    title: "Moment d'Évasion",
                    description: "Site vitrine et plateforme de réservation pour une praticienne bien-être : espace client, messagerie temps réel, tableau de bord admin et gestion de documents.",
                    link: "projet18.html",
                    image: "Photo Projet/reporting.jpg"
                }
            ]
        };

        // Fonction pour afficher les projets
        function displayProjects(category) {
            const grid = document.getElementById('projectsGrid');
            const projectList = projects[category];

            // Animation de sortie
            grid.style.opacity = '0';
            grid.style.transform = 'translateY(20px)';

            setTimeout(() => {
                // Vider la grille
                grid.innerHTML = '';

                // Ajouter les nouveaux projets
                projectList.forEach(project => {
                    const card = document.createElement('a');
                    card.href = project.link;
                    card.className = 'project-card';
                    card.innerHTML = `
                        <img src="${project.image}" alt="${project.title}" class="project-image">
                        <div class="project-info">
                            <span class="project-badge ${category}">${category === 'scolaire' ? 'Scolaire' : 'Personnel'}</span>
                            <h3>${project.title}</h3>
                            <p>${project.description}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                // Animation d'entrée
                setTimeout(() => {
                    grid.style.opacity = '1';
                    grid.style.transform = 'translateY(0)';
                }, 20);
            }, 150);
        }

        // Gestion des boutons de filtre
        const filterButtons = document.querySelectorAll('.filter-btn');

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Retirer la classe active de tous les boutons
                filterButtons.forEach(btn => btn.classList.remove('active'));

                // Ajouter la classe active au bouton cliqué
                button.classList.add('active');

                // Afficher les projets de la catégorie sélectionnée
                const category = button.getAttribute('data-filter');
                displayProjects(category);
            });
        });

        // Lire le paramètre de filtre dans l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const filterParam = urlParams.get('filter');

        if (filterParam && (filterParam === 'scolaire' || filterParam === 'perso')) {
            // Trouver et activer le bouton correspondant
            const targetButton = document.querySelector(`[data-filter="${filterParam}"]`);
            if (targetButton) {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                targetButton.classList.add('active');
                displayProjects(filterParam);
            }
        } else {
            // Afficher les projets scolaires par défaut
            displayProjects('scolaire');
        }
    </script>
</body>

</html>
