<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez Paul Esthor pour des opportunités de stage, d'alternance ou de collaboration en Science des Données.">
    <meta property="og:title" content="Contact | Paul Esthor">
    <meta property="og:description" content="Contactez Paul Esthor pour des opportunités de stage, d'alternance ou de collaboration en Science des Données.">
    <meta property="og:type" content="website">
    <title>Contact | Paul Esthor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Hero Section */
        .contact-hero {
            padding: 150px 0 50px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .contact-hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--secondary);
        }

        .contact-hero p {
            max-width: 800px;
            margin: 0 auto 40px;
            font-size: 1.1rem;
        }

        /* Contact Section */
        .contact-section {
            padding: 60px 0;
            position: relative;
            z-index: 1;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .contact-info,
        .contact-form-container {
            background-color: rgba(26, 39, 68, 0.01);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .contact-info:hover,
        .contact-form-container:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.1),
                0 0 20px rgba(76, 201, 240, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .contact-info h2,
        .contact-form-container h2 {
            color: var(--secondary);
            margin-bottom: 30px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background-color: rgba(76, 201, 240, 0.05);
            transform: translateX(10px);
        }

        .contact-item i {
            font-size: 1.5rem;
            color: var(--secondary);
            width: 30px;
        }

        .contact-item a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-item a:hover {
            color: var(--secondary);
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--secondary);
            background-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .contact-hero {
                padding: 150px 0 50px;
            }

            .contact-hero h1 {
                font-size: 2.2rem;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .contact-info,
            .contact-form-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <!-- Header -->
    <header id="header">
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Paul Esthor</a>
                <div class="nav-links">
                    <a href="index.html">Accueil</a>
                    <a href="Apropos.html">À propos</a>
                    <a href="parcours.html">Mon Parcours</a>
                    <a href="Projet.html">Projets</a>
                    <a href="Competences.html">Compétences</a>
                    <a href="bilan.html">Bilan</a>
                    <a href="Contact.html" class="active">Contact</a>
                </div>
                <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="contact-hero">
            <div class="container">
                <h1>Me Contacter</h1>
                <p>N'hésitez pas à me contacter pour toute question ou opportunité de collaboration</p>
            </div>
        </section>

        <!-- Contact Section -->
        <section class="contact-section">
            <div class="container">
                <div class="contact-grid">
                    <!-- Contact Info -->
                    <div class="contact-info">
                        <h2>Informations de Contact</h2>
                        <div class="contact-item">
                            <i class="fas fa-envelope"></i>
                            <a href="mailto:Esthor.pl@gmail.com">Esthor.pl@gmail.com</a>
                        </div>
                        <div class="contact-item">
                            <i class="fas fa-phone"></i>
                            <a href="tel:+33674903653">06 74 90 36 53</a>
                        </div>
                        <div class="contact-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>Poitiers, France</span>
                        </div>
                        <div class="contact-item">
                            <i class="fab fa-linkedin"></i>
                            <a href="https://www.linkedin.com/in/paul-esthor-7b1712179" target="_blank">LinkedIn</a>
                        </div>
                        <div class="contact-item">
                            <i class="fab fa-github"></i>
                            <a href="https://github.com/paulesthor" target="_blank">GitHub</a>
                        </div>
                    </div>

                    <!-- Contact Form -->
                    <div class="contact-form-container">
                        <h2>Envoyez-moi un message</h2>
                        <form action="https://formsubmit.co/Esthor.pl@gmail.com" method="POST">
                            <input type="text" name="_honey" style="display:none">
                            <input type="hidden" name="_subject" value="Nouveau message de votre Portfolio !">
                            <div class="form-group">
                                <label for="name">Nom</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="subject">Sujet</label>
                                <input type="text" id="subject" name="subject" required>
                            </div>
                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea id="message" name="message" required></textarea>
                            </div>
                            <button type="submit" class="btn">Envoyer <i class="fas fa-paper-plane"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/animation.js"></script>
</body>

</html>
